name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 6"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_VERSION: "3.0.1"

jobs:
  native:
    name: Native (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check version and whitespace
        run: |
          build/lana version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          git diff --check

  asan:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DLANA_ENABLE_SANITIZERS=ON
      - run: cmake --build build-asan --parallel
      - run: ctest --test-dir build-asan --output-on-failure

  tsan:
    name: Thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DLANA_ENABLE_TSAN=ON
      - run: cmake --build build-tsan --parallel
      - run: ctest --test-dir build-tsan --output-on-failure

  integrations:
    name: Optional integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLANA_BUILD_INTEGRATIONS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Test Python bridge and evidence contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/lana-integrations-venv"
          "$RUNNER_TEMP/lana-integrations-venv/bin/python" -m pip install -e 'integrations/python[test]'
          "$RUNNER_TEMP/lana-integrations-venv/bin/python" -m pytest -q integrations/python/tests

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: cargo test --workspace --no-fail-fast

  fuzz-pr:
    name: Fuzz smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DLANA_ENABLE_SANITIZERS=ON -DLANA_BUILD_FUZZERS=ON
      - run: cmake --build build-fuzz --target lana_bytecode_fuzz --parallel
      - run: build-fuzz/lana_bytecode_fuzz -max_total_time=30 -timeout=5

  fuzz-scheduled:
    name: Full fuzz test
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DLANA_ENABLE_SANITIZERS=ON -DLANA_BUILD_FUZZERS=ON
      - run: cmake --build build-fuzz --target lana_bytecode_fuzz --parallel
      - run: build-fuzz/lana_bytecode_fuzz -max_total_time=600 -timeout=5

  rust-fuzz-pr:
    name: Rust fuzz smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --profile minimal
      - run: rustup run nightly cargo install cargo-fuzz --version 0.13.2 --locked
      - run: rustup run nightly cargo fuzz run lana_bytecode -- -max_total_time=30 -timeout=5
        working-directory: fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: rust-fuzz-pr-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  rust-fuzz-scheduled:
    name: Rust full fuzz test
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --profile minimal
      - run: rustup run nightly cargo install cargo-fuzz --version 0.13.2 --locked
      - run: rustup run nightly cargo fuzz run lana_bytecode -- -max_total_time=600 -timeout=5
        working-directory: fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: rust-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
