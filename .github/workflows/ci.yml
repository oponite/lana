name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 6"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_VERSION: "4.0.0"

jobs:
  native:
    name: Rust CLI and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/build.py build
      - run: python3 tests/run.py --no-build
      - run: |
          target/lana/bin/lana version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          git diff --check

  integrations:
    name: Optional integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/build.py build
      - run: python3 tests/run.py --no-build
      - name: Test Python bridge and evidence contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/lana-integrations-venv"
          "$RUNNER_TEMP/lana-integrations-venv/bin/python" -m pip install -e 'integrations/python[test,mcp,jupyter]' tokenizers safetensors numpy
          "$RUNNER_TEMP/lana-integrations-venv/bin/python" -m pytest -q integrations/python/tests
          "$RUNNER_TEMP/lana-integrations-venv/bin/python" -m unittest discover -s tools/lana-hf/tests -v

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo test --locked --workspace --no-fail-fast

  wasm:
    name: Actual WASM execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: bash tools/rust/lana-wasm/tests/run-wasm-conformance.sh

  editors:
    name: Real editor clients
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/build.py build
      - run: brew install neovim
      - run: brew install --cask visual-studio-code
      - run: npm install && npm test
        working-directory: integrations/editors/vscode
      - run: python3 tests/test_editors_live.py neovim target/lana/bin/lana
      - run: python3 tests/test_editors_live.py vscode target/lana/bin/lana

  rust-fuzz-pr:
    name: Rust fuzz smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --profile minimal
      - run: rustup run nightly cargo install cargo-fuzz --version 0.13.2 --locked
      - run: RUSTC="$(rustup which --toolchain nightly rustc)" rustup run nightly cargo fuzz run lana_bytecode -- -max_total_time=30 -timeout=5
        working-directory: fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: rust-fuzz-pr-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  rust-fuzz-scheduled:
    name: Rust full fuzz test
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly --profile minimal
      - run: rustup run nightly cargo install cargo-fuzz --version 0.13.2 --locked
      - run: RUSTC="$(rustup which --toolchain nightly rustc)" rustup run nightly cargo fuzz run lana_bytecode -- -max_total_time=600 -timeout=5
        working-directory: fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: rust-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
