name: Linux distribution

on:
  workflow_call:
    inputs:
      verify-published:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read candidate version
        run: |
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build native bundle and verify dependencies
        if: ${{ !inputs.verify-published }}
        run: |
          python3 tools/build.py build
          python3 tests/verify_install.py --prefix target/lana
          ldd target/lana/bin/lana > "$RUNNER_TEMP/lana-dependencies"
          cat "$RUNNER_TEMP/lana-dependencies"
          ! grep -Ei 'sqlite|not found' "$RUNNER_TEMP/lana-dependencies"
      - name: Rust workspace checks
        if: ${{ !inputs.verify-published }}
        run: cargo test --locked --workspace --no-fail-fast
      - name: Compiler, project, and installer acceptance
        if: ${{ !inputs.verify-published }}
        run: python3 tests/run.py --no-build --filter '^(native_compiler_bootstrap|lana_project_workflow|lana_local_install|lana_binary_package|lana_installers)$'
      - name: Package and test release archive
        if: ${{ !inputs.verify-published }}
        run: |
          archive="$RUNNER_TEMP/lana-$EXPECTED_VERSION-linux-${{ matrix.architecture }}.tar.gz"
          python3 tools/build.py package --from target/lana --output "$archive"
          python3 tests/test_installers.py target/lana/bin/lana target/lana/bin/lana-compiler.labc --archive "$archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.verify-published }}
        with:
          name: lana-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/lana-*-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Verify published installer and bundle
        if: ${{ inputs.verify-published }}
        run: |
          python3 tools/build.py installers --output "$RUNNER_TEMP/expected-installers"
          script="$RUNNER_TEMP/published-install.sh"
          curl -fsSL "https://github.com/oponite/lana/releases/download/v$EXPECTED_VERSION/install.sh" -o "$script"
          cmp "$script" "$RUNNER_TEMP/expected-installers/install.sh"
          mkdir "$RUNNER_TEMP/lana-public-home"
          HOME="$RUNNER_TEMP/lana-public-home" SHELL=/bin/bash sh < "$script"
          python3 tests/verify_install.py --prefix "$RUNNER_TEMP/lana-public-home/.local/share/lana"
