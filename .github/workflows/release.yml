name: Release Lana 2.1.0

on:
  push:
    tags: ["v2.1.0"]

permissions:
  contents: read

env:
  EXPECTED_VERSION: "2.1.0"

jobs:
  linux:
    name: Release gates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tag and version
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$version" = "$EXPECTED_VERSION"
          test "$GITHUB_REF_NAME" = "v$version"
          test "${{ github.ref_protected }}" = "true"
      - name: Debug build and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          build/lana version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          cargo test --workspace
          cargo run --quiet -p lana-cli -- version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          git diff --check
      - name: Address and undefined behavior sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DLANA_ENABLE_SANITIZERS=ON
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure
      - name: Thread sanitizer
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DLANA_ENABLE_TSAN=ON
          cmake --build build-tsan --parallel
          ctest --test-dir build-tsan --output-on-failure
      - name: Ten-minute malformed-bytecode fuzz test
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DLANA_ENABLE_SANITIZERS=ON -DLANA_BUILD_FUZZERS=ON
          cmake --build build-fuzz --target lana_bytecode_fuzz --parallel
          build-fuzz/lana_bytecode_fuzz -max_total_time=600 -timeout=5
      - name: Optional integrations
        run: |
          cmake -S . -B build-integrations -DCMAKE_BUILD_TYPE=Release -DLANA_BUILD_INTEGRATIONS=ON
          cmake --build build-integrations --parallel
          ctest --test-dir build-integrations --output-on-failure
          python3 -m venv "$RUNNER_TEMP/lana-integrations-venv"
          "$RUNNER_TEMP/lana-integrations-venv/bin/python" -m pip install -e 'integrations/python[test]'
          "$RUNNER_TEMP/lana-integrations-venv/bin/python" -m pytest -q integrations/python/tests

  macos-slices:
    name: Release gate (macOS ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tag and version
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$version" = "$EXPECTED_VERSION"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build and install ${{ matrix.arch }} binaries
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES='${{ matrix.arch }}'
          cmake --build build-release --parallel
          prefix="$RUNNER_TEMP/lana-install-${{ matrix.arch }}"
          cmake --install build-release --prefix "$prefix"
          lipo "$prefix/bin/lana" -verify_arch '${{ matrix.arch }}'
          lipo "$prefix/bin/lanavm" -verify_arch '${{ matrix.arch }}'
          "$prefix/bin/lana" run examples/belief.lana
          tar -C "$prefix" -czf "$RUNNER_TEMP/lana-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lana-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/lana-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Assemble macOS universal artifact
    needs: macos-slices
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lana-macos-*
          path: ${{ runner.temp }}/lana-slices
      - name: Assemble universal installed prefix
        run: |
          arm="$RUNNER_TEMP/lana-arm64"
          intel="$RUNNER_TEMP/lana-x86_64"
          mkdir "$arm" "$intel"
          tar -C "$arm" -xzf "$RUNNER_TEMP/lana-slices/lana-macos-arm64/lana-arm64.tar.gz"
          tar -C "$intel" -xzf "$RUNNER_TEMP/lana-slices/lana-macos-x86_64/lana-x86_64.tar.gz"
          prefix="$RUNNER_TEMP/lana-install"
          cp -R "$arm" "$prefix"
          for file in bin/lana bin/lanavm lib/liblanaruntime.a; do
            lipo -create "$arm/$file" "$intel/$file" -output "$prefix/$file"
          done
          lipo "$prefix/bin/lana" -verify_arch arm64 x86_64
          lipo "$prefix/bin/lanavm" -verify_arch arm64 x86_64
          arch -arm64 "$prefix/bin/lana" version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          arch -x86_64 "$prefix/bin/lana" version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          tar -C "$prefix" -czf "$RUNNER_TEMP/lana-${EXPECTED_VERSION}-macos-universal.tar.gz" .
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "lana-${EXPECTED_VERSION}-macos-universal.tar.gz" \
              > "lana-${EXPECTED_VERSION}-macos-universal.tar.gz.sha256"
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lana-macos-universal
          path: |
            ${{ runner.temp }}/lana-2.1.0-macos-universal.tar.gz
            ${{ runner.temp }}/lana-2.1.0-macos-universal.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  verify-macos-artifact:
    name: Verify macOS release artifact
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lana-macos-universal
          path: ${{ runner.temp }}/lana-release-artifact
      - name: Verify downloaded installed-prefix archive
        run: |
          artifact_dir="$RUNNER_TEMP/lana-release-artifact"
          archive="lana-${EXPECTED_VERSION}-macos-universal.tar.gz"
          (
            cd "$artifact_dir"
            shasum -a 256 -c "$archive.sha256"
          )
          prefix="$RUNNER_TEMP/lana-verified-install"
          mkdir "$prefix"
          tar -C "$prefix" -xzf "$artifact_dir/$archive"
          lipo "$prefix/bin/lana" -verify_arch arm64 x86_64
          lipo "$prefix/bin/lanavm" -verify_arch arm64 x86_64
          arch -arm64 "$prefix/bin/lana" version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          arch -x86_64 "$prefix/bin/lana" version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          cp examples/belief.lana "$prefix/belief.lana"
          "$prefix/bin/lana" run "$prefix/belief.lana"

  publish:
    name: Publish GitHub Release
    needs: [linux, verify-macos-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lana-macos-universal
          path: ${{ runner.temp }}/lana-release-files
      - name: Build source archive and checksums
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$version" = "$EXPECTED_VERSION"
          test "$GITHUB_REF_NAME" = "v$version"
          test "${{ github.ref_protected }}" = "true"
          git archive --format=tar.gz --prefix="lana-$version/" --output="$RUNNER_TEMP/lana-release-files/lana-$version-source.tar.gz" "$GITHUB_SHA"
          rm "$RUNNER_TEMP/lana-release-files/lana-$version-macos-universal.tar.gz.sha256"
          (
            cd "$RUNNER_TEMP/lana-release-files"
            sha256sum *.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Generate Homebrew formula artifact
        run: |
          source_archive="$RUNNER_TEMP/lana-release-files/lana-${EXPECTED_VERSION}-source.tar.gz"
          source_sha256="$(sha256sum "$source_archive" | awk '{print $1}')"
          formula="$RUNNER_TEMP/lana-release-files/lana.rb"
          cat > "$formula" <<EOF
          class Lana < Formula
            desc "Verified register-based language with explicit uncertainty"
            homepage "https://github.com/oponite/lana"
            url "https://github.com/oponite/lana/releases/download/v${EXPECTED_VERSION}/lana-${EXPECTED_VERSION}-source.tar.gz"
            sha256 "${source_sha256}"
            license "Apache-2.0"

            depends_on "cmake" => :build
            depends_on "pkgconf" => :build
            depends_on "libffi"
            depends_on "openssl@3"

            def install
              system "cmake", "-S", ".", "-B", "build", *std_cmake_args
              system "cmake", "--build", "build", "--parallel"
              system "cmake", "--install", "build"
              libexec.install bin/"lana-compiler.labc"
              (bin/"lana").rename bin/"lana-bin"
              (bin/"lana").write <<~EOS
                #!/bin/sh
                export LANA_COMPILER_LABC="#{libexec}/lana-compiler.labc"
                exec "#{bin}/lana-bin" "\$@"
              EOS
            end

            test do
              assert_match "Lana #{version} (LABC v2,", shell_output("#{bin}/lana version")
              system bin/"lana", "new", "hello-lana"
              Dir.chdir("hello-lana") do
                system bin/"lana", "build"
                system bin/"lana", "run"
              end
            end
          end
          EOF
          ruby -c "$formula"
          test -s "$formula"
      - name: Verify source archive in a clean directory
        run: |
          source_root="$RUNNER_TEMP/lana-verified-source"
          mkdir "$source_root"
          tar -C "$source_root" -xzf "$RUNNER_TEMP/lana-release-files/lana-${EXPECTED_VERSION}-source.tar.gz"
          cmake -S "$source_root/lana-${EXPECTED_VERSION}" -B "$source_root/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$source_root/build" --parallel
          "$source_root/build/lana" version | grep -F "Lana ${EXPECTED_VERSION} (LABC v2,"
          "$source_root/build/lana" run "$source_root/lana-${EXPECTED_VERSION}/examples/belief.lana"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lana $EXPECTED_VERSION" \
            --generate-notes \
            "$RUNNER_TEMP/lana-release-files"/*
