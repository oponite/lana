name: Windows distribution

on:
  workflow_call:
    inputs:
      verify-published:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve frozen fixture bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read candidate version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          "EXPECTED_VERSION=$version" >> $env:GITHUB_ENV
      - name: Select native Rust toolchain
        if: ${{ !inputs.verify-published }}
        run: rustup default stable-${{ matrix.target }}
      - name: Build a self-contained native bundle
        if: ${{ !inputs.verify-published }}
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          python tools/build.py build --target ${{ matrix.target }}
          if ($LASTEXITCODE) { throw 'Windows build failed' }
          python tests/verify_install.py --prefix target/lana
          if ($LASTEXITCODE) { throw 'Native installation check failed' }
          # SQLite and the CRT must not depend on software installed on the runner.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Host*\${{ matrix.architecture }}\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $dependencies = & $dumpbin.FullName /dependents target/lana/bin/lana.exe
          if ($LASTEXITCODE -or ($dependencies -match '(?i)(sqlite3|vcruntime\d+(_\d+)?|msvcp\d+(_\d+)?)\.dll')) { throw 'Unbundled native runtime dependency' }
      - name: Rust workspace checks
        if: ${{ !inputs.verify-published }}
        run: cargo test --locked --workspace --no-fail-fast --target ${{ matrix.target }}
      - name: Portable compiler and project acceptance
        if: ${{ !inputs.verify-published }}
        run: |
          python tests/run.py --no-build --filter '^(native_compiler_bootstrap|lana_project_workflow|lana_local_install|lana_binary_package|lana_installers)$'
          if ($LASTEXITCODE) { throw 'Windows acceptance failed' }
      - name: Package Windows release archive
        if: ${{ !inputs.verify-published }}
        run: |
          python tools/build.py package --from target/lana --output "$env:RUNNER_TEMP/lana-$env:EXPECTED_VERSION-windows-${{ matrix.architecture }}.zip"
          if ($LASTEXITCODE) { throw 'Windows packaging failed' }
          python tests/test_installers.py target/lana/bin/lana.exe target/lana/bin/lana-compiler.labc --archive "$env:RUNNER_TEMP/lana-$env:EXPECTED_VERSION-windows-${{ matrix.architecture }}.zip"
          if ($LASTEXITCODE) { throw 'Packaged installer check failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.verify-published }}
        with:
          name: lana-windows-${{ matrix.architecture }}
          path: ${{ runner.temp }}/lana-*-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Verify the published PowerShell installer
        if: ${{ inputs.verify-published }}
        run: |
          python tools/build.py installers --output "$env:RUNNER_TEMP/expected-installers"
          if ($LASTEXITCODE) { throw 'Installer rendering failed' }
          $url = "https://github.com/oponite/lana/releases/download/v$env:EXPECTED_VERSION/install.ps1"
          $script = "$env:RUNNER_TEMP/published-install.ps1"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $script
          if ((Get-FileHash $script).Hash -ne (Get-FileHash "$env:RUNNER_TEMP/expected-installers/install.ps1").Hash) { throw 'Published installer differs from candidate' }
          $oldAppData = $env:LOCALAPPDATA
          $registry = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $pathExisted = @($registry.GetValueNames() | Where-Object { $_ -ieq 'Path' }).Count -ne 0
          $oldUserPath = $registry.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $pathKind = if ($pathExisted) { $registry.GetValueKind('Path') } else { [Microsoft.Win32.RegistryValueKind]::String }
          try {
            $env:LOCALAPPDATA = "$env:RUNNER_TEMP/lana-public-home"
            Get-Content $script -Raw | Invoke-Expression
            $prefix = "$env:LOCALAPPDATA/Programs/Lana"
            python tests/verify_install.py --prefix $prefix
            if ($LASTEXITCODE) { throw 'Published Windows installation failed' }
          } finally {
            if ($pathExisted) { $registry.SetValue('Path', $oldUserPath, $pathKind) } else { $registry.DeleteValue('Path', $false) }
            $registry.Dispose()
            $env:LOCALAPPDATA = $oldAppData
          }
