[package]
name = "lana-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lana host calls, adapters, and durable pipeline (phase 2 of the Rust runtime boundary)"

[[example]]
name = "lana_store_probe"
path = "../../../tests/conformance/durable/store_probe.rs"

[features]
# LIP-019 TLS client verification. On by default for native; the wasm
# targets (lana-wasm / lana-wasm-wasi) build this crate with
# default-features = false so rustls/ring never enter the wasm graph
# (https fails cleanly with an unsupported/verify error at the LIP-025
# boundary rather than failing to compile).
default = ["net-tls"]
net-tls = ["lana-vm/net-tls"]

[dependencies]
lana-bytecode = { workspace = true }
lana-vm = { workspace = true, default-features = false }
ed25519-compact = { version = "2.4.2", default-features = false, features = ["std"] }
