[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lana-lang"
version = "0.2.0"
description = "A general-purpose language where uncertain, evolving information is first-class state"
requires-python = ">=3.11"

[project.scripts]
ss = "lana_tooling.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lana_tooling*"]
