[workspace]
resolver = "2"
members = [
    "vm/rust/lana-bytecode",
    "vm/rust/lana-vm",
    "runtime/rust/lana-runtime",
    "tools/rust/lana-cli",
    "tools/rust/lana-fuzz",
    "tools/rust/lana-wasm",
]

[workspace.package]
version = "4.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lana-bytecode = { path = "vm/rust/lana-bytecode" }
lana-vm = { path = "vm/rust/lana-vm", default-features = false }
lana-runtime = { path = "runtime/rust/lana-runtime", default-features = false }

# Keep the Rust VM optimized for the published performance gate.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
