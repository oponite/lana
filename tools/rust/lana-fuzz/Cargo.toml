[package]
name = "lana-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fuzz targets for the Lana Rust runtime boundary"

[dependencies]
lana-bytecode = { path = "../../../vm/rust/lana-bytecode" }

# `rlib` lets the driver and cargo-fuzz target reuse the loader/verifier check.
[lib]
name = "lana_fuzz"
crate-type = ["rlib"]

[[bin]]
name = "fuzz-driver"
path = "src/bin/fuzz_driver.rs"
