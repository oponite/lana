[package]
name = "lana-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the Lana runtime (check/run/diagnostics)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lana-bytecode = { workspace = true }
# The wasm target has no host TLS stack; disable the `net-tls` default feature
# so rustls does not enter the wasm32-unknown-unknown build.
lana-vm = { workspace = true, default-features = false }
# lana-vm is off net-tls above; lana-runtime must not re-enable it (it would
# leak rustls/ring/getrandom into the wasm build via feature unification).
lana-runtime = { workspace = true, default-features = false }
wasm-bindgen = "=0.2.100"
